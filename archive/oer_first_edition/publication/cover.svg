  </g>

  <text x="120" y="180" fill="#c7ebe5" font-family="Avenir Next, Segoe UI, sans-serif" font-size="36" font-weight="700" letter-spacing="3">CST4714  |  OPEN COURSE</text>

  <text x="120" y="650" fill="#fbfaf6" font-family="Avenir Next, Segoe UI, sans-serif" font-size="174" font-weight="800">
    <tspan x="120" dy="0">OPERATING</tspan>
    <tspan x="120" dy="185">CLOUD</tspan>
    <tspan x="120" dy="185">DATABASES</tspan>
  </text>

  <rect x="120" y="1240" width="620" height="12" fill="#f4b942"/>
  <text x="120" y="1345" fill="#dcefeb" font-family="Avenir Next, Segoe UI, sans-serif" font-size="58" font-weight="500">
    <tspan x="120" dy="0">PostgreSQL, MongoDB, and</tspan>
    <tspan x="120" dy="78">Reliable Data Systems</tspan>
  </text>

  <g transform="translate(120 1660)">
    <rect width="1360" height="470" rx="34" fill="#fbfaf6"/>
    <g transform="translate(70 72)">
      <rect x="0" y="0" width="300" height="220" rx="24" fill="#dcefeb"/>
      <rect x="455" y="0" width="300" height="220" rx="24" fill="#dcefeb"/>
      <rect x="910" y="0" width="300" height="220" rx="24" fill="#dcefeb"/>
      <text x="150" y="98" text-anchor="middle" fill="#0b4f4a" font-family="Avenir Next, Segoe UI, sans-serif" font-size="44" font-weight="750">RELATION</text>
      <text x="150" y="155" text-anchor="middle" fill="#475569" font-family="SFMono-Regular, Consolas, monospace" font-size="30">rows + rules</text>
      <text x="605" y="98" text-anchor="middle" fill="#0b4f4a" font-family="Avenir Next, Segoe UI, sans-serif" font-size="44" font-weight="750">DOCUMENT</text>
      <text x="605" y="155" text-anchor="middle" fill="#475569" font-family="SFMono-Regular, Consolas, monospace" font-size="30">shape + access</text>
      <text x="1060" y="98" text-anchor="middle" fill="#0b4f4a" font-family="Avenir Next, Segoe UI, sans-serif" font-size="44" font-weight="750">CLOUD</text>
      <text x="1060" y="155" text-anchor="middle" fill="#475569" font-family="SFMono-Regular, Consolas, monospace" font-size="30">service + evidence</text>
      <path d="M315 110H430" stroke="#b45309" stroke-width="12"/>
      <path d="M405 82L433 110L405 138" fill="none" stroke="#b45309" stroke-width="12"/>
