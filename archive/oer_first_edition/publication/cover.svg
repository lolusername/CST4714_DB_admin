    <circle cx="1320" cy="760" r="18"/>
    <circle cx="1210" cy="1030" r="18"/>
    <circle cx="1350" cy="1270" r="18"/>
    <circle cx="1110" cy="1440" r="18"/>
    <circle cx="860" cy="1240" r="18"/>
    <circle cx="590" cy="1130" r="18"/>
