<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img" aria-labelledby="title desc">
  <title id="title">Operating Cloud Databases book cover</title>
  <desc id="desc">A teal and cream cover with connected relational tables, documents, and cloud database symbols.</desc>
  <rect width="1600" height="2560" fill="#0b4f4a"/>
  <path d="M0 0H1600V190L0 590Z" fill="#0f766e"/>
  <circle cx="1390" cy="250" r="330" fill="#dcefeb" opacity="0.18"/>
  <circle cx="180" cy="2230" r="420" fill="#f4b942" opacity="0.12"/>

  <g opacity="0.34" stroke="#c7ebe5" stroke-width="8" fill="none">
