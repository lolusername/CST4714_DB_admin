<!doctype html>
<html lang="$lang$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="pandoc">
  <meta name="description" content="$description$">
  <title>$title$ - $subtitle$</title>
  $for(author-meta)$<meta name="author" content="$author-meta$">$endfor$
  $for(css)$<link rel="stylesheet" href="$css$">$endfor$
  $for(header-includes)$$header-includes$$endfor$
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="book-masthead" aria-labelledby="book-title">
    <p>Second edition draft | $date$</p>
    <h1 id="book-title">$title$</h1>
    <p><strong>$subtitle$</strong></p>
    <p>By $for(author)$$author$$sep$, $endfor$</p>
  </header>
  $if(toc)$
  <nav id="$idprefix$TOC" role="doc-toc" aria-label="Table of contents">
    <h2>Contents</h2>
    $table-of-contents$
  </nav>
  $endif$
  <main id="main-content" tabindex="-1">
    $body$
  </main>
</body>
</html>
