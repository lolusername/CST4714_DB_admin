[project]
name = "cst4714-course-authoring"
version = "0.1.0"
description = "Reproducible authoring tools for the CST4714 course package"
requires-python = ">=3.11"
dependencies = [
  "nbformat>=5.10,<6",
  "python-docx>=1.1,<2",
]

[tool.uv]
package = false

[dependency-groups]
audit = [
  "duckdb>=1.3,<2",
  "pymongo>=4.13,<5",
  "mongomock>=4.3,<5",
  "psycopg[binary]>=3.2,<4",
  "nbclient>=0.10,<1",
  "ipykernel>=6,<8",
]
